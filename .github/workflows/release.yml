name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Download ffmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_temp
          New-Item -ItemType Directory -Force -Path build_temp
          $ffmpegExe = Get-ChildItem -Recurse -Filter "ffmpeg.exe" ffmpeg_temp | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName build_temp\ffmpeg.exe

      - name: Build with PyInstaller
        run: pyinstaller seminar_downloader.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Create installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer_output
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: installer_output/DodioDownloader_Setup.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Install and bundle ffmpeg
        run: |
          brew install ffmpeg
          mkdir -p build_temp
          cp "$(which ffmpeg)" build_temp/ffmpeg

      - name: Build with PyInstaller
        run: pyinstaller seminar_downloader_mac.spec --noconfirm

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "DodioDownloader" \
            -srcfolder "dist/DodioDownloader.app" \
            -ov -format UDZO \
            DodioDownloader.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: DodioDownloader.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: macos-dmg
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/DodioDownloader_Setup.exe
            artifacts/DodioDownloader.dmg
          generate_release_notes: true
